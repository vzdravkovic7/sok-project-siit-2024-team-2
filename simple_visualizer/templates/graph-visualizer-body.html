<div style="display: flex; flex-direction: column; width: 100%; height: 100vh;">
    <!-- Top section: Main View and Bird View -->
    <div style="display: flex; flex: 1;">
        <div style="flex: 2; display: flex; flex-direction: column; align-items: center;">
            <svg id="main-svg" width="500" height="500"></svg>
        </div>
        <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
            <svg id="bird-view" width="200" height="200"></svg>
        </div>
    </div>

    <!-- Bottom section: Tree View -->
    <div id="tree-view" style="flex: 1; overflow-y: auto; overflow-x: auto; border-top: 1px solid #ccc; width:80vw;">
    </div>
</div>

<script src="https://d3js.org/d3.v3.min.js"></script>
<script>
    var data = {{ data_json| safe }};
    var width = 500, height = 500;
    var birdWidth = 200, birdHeight = 200;

    var treeData = {{ tree_data_json| safe }};
    var treeWidth = 500, treeHeight = 2000;

    var treeLayout = d3.layout.tree().size([treeHeight, treeWidth * 2]).nodeSize([30, 90]);

    var treeSvg = d3.select("#tree-view").append("svg")
        .attr("width", treeWidth)
        .attr("height", treeHeight)
        .append("g")
        .attr("transform", "translate(50,500)");

    // Build adjacency map from directed edges (node -> friend)
    const adjacency = (() => {
        const m = new Map();
        (data.edges || []).forEach(e => {
            if (!m.has(e.from)) m.set(e.from, []);
            m.get(e.from).push(e.to);
        });
        return m;
    })();

    // Collect all unique node IDs
    const allNodeIds = Array.from(
        new Set([...adjacency.keys(), ...[].concat(...adjacency.values())])
    );

    function buildComponents(nodes, adjacency) {
        let visited = new Set();
        let components = [];

        function dfs(start) {
            let stack = [start];
            let comp = [];
            while (stack.length) {
                let node = stack.pop();
                if (visited.has(node)) continue;
                visited.add(node);
                comp.push(node);
                let neighbors = adjacency.get(node) || [];
                neighbors.forEach(n => {
                    if (!visited.has(n)) stack.push(n);
                });
            }
            return comp;
        }

        nodes.forEach(n => {
            if (!visited.has(n)) {
                components.push(dfs(n));
            }
        });

        return components;
    }

    const components = buildComponents(allNodeIds, adjacency);

    let __uidSeq = 0;
    function genUid(seed = "n") { __uidSeq += 1; return seed + "__u" + __uidSeq; }

    function baseId(d) {
        if (d.baseId) return d.baseId;
        if (typeof d.id === "string" && d.id.indexOf("node_") === 0) return d.id.slice(5);
        return d.id;
    }

    // Lazy child creation from adjacency
    function materializeChildren(node) {
        const neighbors = adjacency.get(baseId(node)) || [];
        node.children = neighbors.map(nId => ({
            id: "node_" + nId,
            baseId: nId,
            uid: genUid(nId),
            hidden: false
        }));
    }

    // Collapse all children of a node
    function collapseAll(node) {
        if (node.children) {
            node._children = node.children;
            node._children.forEach(child => {
                child.hidden = true;
                collapseAll(child);
            });
            node.children = null;
        }
    }

    const forestRoot = {
        id: "forest_root",
        uid: genUid("forest"),
        hidden: true,
        children: treeData.map(rootNode => ({
            ...rootNode,
            uid: genUid(rootNode.id),
            hidden: false
        }))
    };

    forestRoot.children.forEach(collapseAll);

    // Helper to know if a node can expand (for showing “[+]” before it has _children)
    function hasExpandableChildren(d) {
        if (d.children && d.children.length) return true;
        if (d._children && d._children.length) return true;
        const nbrs = adjacency.get(baseId(d)) || [];
        return nbrs.length > 0;
    }

    function updateTree() {
        var nodes = treeLayout.nodes(forestRoot);
        var links = treeLayout.links(nodes);

        var maxDepth = d3.max(nodes, d => d.depth) || 0;
        var nodeSpacing = 100;
        var requiredWidth = (maxDepth + 1) * nodeSpacing;

        d3.select("#tree-view svg")
            .attr("width", Math.max(requiredWidth, 500));

        // Update links
        var treeLink = treeSvg.selectAll(".tree-link")
            .data(links, d => d.target.uid);

        treeLink.enter().append("line")
            .attr("class", "tree-link")
            .attr("stroke", "#999");

        treeLink.attr("x1", d => d.source.y)
            .attr("y1", d => d.source.x)
            .attr("x2", d => d.target.y)
            .attr("y2", d => d.target.x);

        treeLink.exit().remove();

        // Update nodes
        var treeNode = treeSvg.selectAll(".tree-node")
            .data(nodes, d => d.uid);

        var nodeEnter = treeNode.enter().append("g")
            .attr("class", d => `tree-node tree-node-${d.id} tree-node-uid-${d.uid}`)
            .attr("transform", d => `translate(${d.y},${d.x})`)
            .on("click", toggleNode);

        nodeEnter.append("circle")
            .attr("r", 15)
            .attr("fill", "lightblue");

        nodeEnter.append("text")
            .attr("dx", 20)
            .attr("dy", 5);

        treeNode.attr("transform", d => `translate(${d.y},${d.x})`);

        // Update node text for expansion state
        treeNode.select("text")
            .text(d => {
                const prefix = d.children ? "[-] " : (hasExpandableChildren(d) ? "[+] " : "");
                return prefix + d.id;
            });

        // Show/hide nodes properly
        treeNode.style("display", d => (d.hidden ? "none" : "block"));

        treeNode.exit().remove();

        // Ensure highlight remains
        d3.selectAll(".tree-node circle").attr("fill", "lightblue");
        if (currentHighlightedNode) highlightTreeNode(currentHighlightedNode);
    }

    // Track highlighted node
    let currentHighlightedNode = null;

    function highlightTreeNode(nodeId) {
        let correctedId = "node_" + nodeId;
        let nodeSelection = d3.select(".tree-node-" + correctedId);

        nodeSelection.select("circle")
            .transition().duration(200)
            .attr("fill", "red");
    }


    // Function to remove highlight from a tree node
    function unhighlightTreeNode(nodeId) {
        d3.selectAll(".tree-node-node_" + nodeId + " circle")
            .transition().duration(200)
            .attr("fill", "lightblue");
    }

    function toggleNode(d) {
        if (d.children && d.children.length) {
            d._children = d.children;
            d._children.forEach(child => child.hidden = true);
            d.children = null;
        } else {
            if (d._children && d._children.length) {
                d.children = d._children;
                d.children.forEach(child => child.hidden = false);
                d._children = null;
            } else {
                materializeChildren(d);
            }
        }
        updateTree();
    }

    updateTree();


    // Compute graph bounds for scaling in Bird View
    var minX = d3.min(data.nodes, d => d.x);
    var maxX = d3.max(data.nodes, d => d.x);
    var minY = d3.min(data.nodes, d => d.y);
    var maxY = d3.max(data.nodes, d => d.y);

    var graphWidth = maxX - minX;
    var graphHeight = maxY - minY;
    var scaleFactor = Math.min(birdWidth / graphWidth, birdHeight / graphHeight) * 0.5; // Smaller to fit better

    var offsetX = (birdWidth - graphWidth * scaleFactor) / 1.3;
    var offsetY = (birdHeight - graphHeight * scaleFactor) / 1.3;

    // Main View
    var svg = d3.select("#main-svg")
        .attr("width", width)
        .attr("height", height);

    var container = svg.append("g");

    // Arrow marker
    svg.append("defs").append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 20)  // how far from the node center the arrow tip should be
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5") // arrow shape
        .attr("fill", "#9ecae1");

    var zoom = d3.behavior.zoom()
        .scaleExtent([0.5, 2])
        .on("zoom", function () {
            container.attr("transform", `translate(${d3.event.translate}) scale(${d3.event.scale})`);
            updateBirdView();
        });

    svg.call(zoom);

    data.edges.forEach(function (edge) {
        edge.source = data.nodes.find(node => node.id === edge.from);
        edge.target = data.nodes.find(node => node.id === edge.to);
    });

    var force = d3.layout.force()
        .size([width, height])
        .nodes(data.nodes)
        .links(data.edges)
        .linkDistance(300)
        .charge(-500)
        .on("tick", tick)
        .start();

    var link = container.selectAll(".link")
        .data(data.edges)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke-width", 2)
        .attr("stroke", "#9ecae1")
        .attr("marker-end", "url(#arrow)");

    var node = container.selectAll(".node")
        .data(data.nodes)
        .enter().append("g")
        .attr("class", d => "node main-node-" + d.id)
        .call(d3.behavior.drag()
            .on("dragstart", function (d) {
                d3.event.sourceEvent.stopPropagation();
                d.fixed = true;
            })
            .on("drag", function (d) {
                d.px += d3.event.dx;
                d.py += d3.event.dy;
                d.x += d3.event.dx;
                d.y += d3.event.dy;
                force.resume();
                updateBirdView();
            })
            .on("dragend", function (d) {
                d.fixed = false;
            })
        );

    node.append("circle")
        .attr("r", 10)
        .attr("fill", "blue");

    node.append("text")
        .attr("dx", 12)
        .attr("dy", 4)
        .text(d => d.id)
        .style("font-size", "12px");

    function tick() {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
        updateBirdView();
    }

    function showDetails(d) {
        // Highlight in both views
        d3.selectAll(".main-node-" + d.id + " circle").transition().duration(200).attr("fill", "red");
        d3.selectAll(".bird-node-" + d.id).transition().duration(200).attr("fill", "red");

        // Highlight in tree view
        highlightTreeNode(d.id);

        d3.select("body").append("div")
            .attr("id", "tooltip")
            .style("position", "absolute")
            .style("background", "lightgray")
            .style("padding", "5px")
            .style("border-radius", "5px")
            .style("left", `${d3.event.pageX + 10}px`)
            .style("top", `${d3.event.pageY - 20}px`)
            .text(`ID: ${d.id}`);
    }

    function hideDetails(d) {
        d3.selectAll(".main-node-" + d.id + " circle").transition().duration(200).attr("fill", "blue");
        d3.selectAll(".bird-node-" + d.id).transition().duration(200).attr("fill", "blue");

        // Remove highlight in tree view
        unhighlightTreeNode(d.id);

        d3.select("#tooltip").remove();
    }

    function nodeClick(d) {
        alert(`Node ID: ${d.id}, Name: ${d.name}`);
    }

    node.on("click", nodeClick);
    node.on("mouseover", showDetails);
    node.on("mouseout", hideDetails);

    // Bird View Setup
    var birdSvg = d3.select("#bird-view");
    var birdContainer = birdSvg.append("g");

    var birdLink = birdContainer.selectAll(".bird-link")
        .data(data.edges)
        .enter().append("line")
        .attr("class", "bird-link")
        .attr("stroke-width", 1)
        .attr("stroke", "#aaa");

    var birdNode = birdContainer.selectAll(".bird-node")
        .data(data.nodes)
        .enter().append("circle")
        .attr("class", d => "bird-node bird-node-" + d.id)
        .attr("r", 3)
        .attr("fill", "blue");

    var birdViewport = birdSvg.append("rect")
        .attr("fill", "none")
        .attr("stroke", "red")
        .attr("stroke-width", 1);

    function updateBirdView() {
        birdNode.attr("cx", d => (d.x - minX) * scaleFactor + offsetX)
            .attr("cy", d => (d.y - minY) * scaleFactor + offsetY);

        birdLink.attr("x1", d => (d.source.x - minX) * scaleFactor + offsetX)
            .attr("y1", d => (d.source.y - minY) * scaleFactor + offsetY)
            .attr("x2", d => (d.target.x - minX) * scaleFactor + offsetX)
            .attr("y2", d => (d.target.y - minY) * scaleFactor + offsetY);

        var mainTransform = d3.transform(container.attr("transform"));
        var tx = -mainTransform.translate[0] * scaleFactor + offsetX;
        var ty = -mainTransform.translate[1] * scaleFactor + offsetY;
        var s = mainTransform.scale[0];

        birdViewport.attr("x", tx)
            .attr("y", ty)
            .attr("width", (width / s) * scaleFactor)
            .attr("height", (height / s) * scaleFactor);
    }
</script>
