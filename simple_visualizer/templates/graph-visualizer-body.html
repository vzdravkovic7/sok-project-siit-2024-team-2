<div>
    <svg width="500" height="500"></svg>
</div>

<script src="https://d3js.org/d3.v3.min.js"></script>
<script>
    var data = {{ data_json|safe }};

    var width = 500, height = 500;

    // Create SVG and append a 'g' group for transformations
    var svg = d3.select("svg")
        .attr("width", width)
        .attr("height", height);

    var container = svg.append("g");

    // Enable zooming and panning
    var zoom = d3.behavior.zoom()
        .scaleExtent([0.5, 2])
        .on("zoom", function () {
            container.attr("transform", `translate(${d3.event.translate}) scale(${d3.event.scale})`);
        });

    svg.call(zoom);

    // Ensure edge 'source' and 'target' refer to actual node objects
    data.edges.forEach(function (edge) {
        edge.source = data.nodes.find(node => node.id === edge.from);
        edge.target = data.nodes.find(node => node.id === edge.to);
    });

    // Set up force-directed layout
    var force = d3.layout.force()
        .size([width, height])
        .nodes(data.nodes)
        .links(data.edges)
        .linkDistance(300)
        .charge(-500)
        .on("tick", tick)
        .start();

    // Create links (edges)
    var link = container.selectAll(".link")
        .data(data.edges)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke-width", 2)
        .attr("stroke", "#9ecae1");

    // Create node groups (so text and circles move together)
    var node = container.selectAll(".node")
        .data(data.nodes)
        .enter().append("g")
        .attr("class", "node");
        node.call(
        d3.behavior.drag()
            .on("dragstart", function (d) {
                d3.event.sourceEvent.stopPropagation(); // Prevent zoom from interfering
                d.fixed = true; // Ensure the node remains dynamic
            })
            .on("drag", function (d) {
                d.px += d3.event.dx;
                d.py += d3.event.dy;
                d.x += d3.event.dx;
                d.y += d3.event.dy;
                force.resume(); // Restart force simulation
            })
            .on("dragend", function (d) {
                d.fixed = false; // Let the node continue moving naturally
            })
    );
      // Enable dragging

    // Append circles to represent nodes
    node.append("circle")
        .attr("r", 10)
        .attr("fill", "blue")
        .on("mouseover", showDetails)
        .on("mouseout", hideDetails);

    // Append text labels to nodes
    node.append("text")
        .attr("dx", 12)
        .attr("dy", 4)
        .text(d => d.id)
        .style("font-size", "12px");

    // Function to update positions after each force layout tick
    function tick() {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    }

    // Show node details on hover
    function showDetails(d) {
        d3.select(this).transition().duration(200).attr("fill", "red"); // Highlight

        d3.select("body").append("div")
            .attr("id", "tooltip")
            .style("position", "absolute")
            .style("background", "lightgray")
            .style("padding", "5px")
            .style("border-radius", "5px")
            .style("left", `${d3.event.pageX + 10}px`)
            .style("top", `${d3.event.pageY - 20}px`)
            .text(`ID: ${d.id}, Name: ${d.name}`);
    }

    // Hide tooltip on mouseout
    function hideDetails() {
        d3.select(this).transition().duration(200).attr("fill", "blue"); // Restore color
        d3.select("#tooltip").remove();
    }

    // Handle node click
    function nodeClick(d) {
        alert(`Node ID: ${d.id}, Name: ${d.name}`);
    }

    node.on("click", nodeClick);
</script>
