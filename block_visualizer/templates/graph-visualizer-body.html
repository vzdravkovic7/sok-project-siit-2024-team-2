<div style="display: flex; flex-direction: column; width: 100%; height: 100vh;">
    <!-- Top section: Main View and Bird View -->
    <div style="display: flex; flex: 1;">
        <div style="flex: 2; display: flex; flex-direction: column; align-items: center;">
            <svg id="main-svg" width="500" height="500"></svg>
        </div>
        <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
            <svg id="bird-view" width="200" height="200"></svg>
        </div>
    </div>

    <!-- Bottom section: Tree View -->
    <div id="tree-view" style="flex: 1; overflow-y: auto; overflow-x: auto; border-top: 1px solid #ccc; width:80vw;">
    </div>
</div>

<script src="https://d3js.org/d3.v3.min.js"></script>
<script>
    var data = {{ data_json| safe }};
    var width = 700, height = 500;
    var birdWidth = 200, birdHeight = 200;

    var treeData = {{ tree_data_json| safe }};
    var treeWidth = 500, treeHeight = 500;

    var treeLayout = d3.layout.tree().size([treeHeight, treeWidth * 2]).nodeSize([30, 90]);

    var treeSvg = d3.select("#tree-view").append("svg")
        .attr("width", treeWidth)
        .attr("height", treeHeight)
        .append("g")
        .attr("transform", "translate(50,500)");

    // Build adjacency map from directed edges (node -> friend)
    const adjacency = (() => {
        const m = new Map();
        (data.edges || []).forEach(e => {
            if (!m.has(e.from)) m.set(e.from, []);
            m.get(e.from).push(e.to);
        });
        return m;
    })();

    // Collect all unique node IDs
    const allNodeIds = Array.from(
        new Set([...adjacency.keys(), ...[].concat(...adjacency.values())])
    );

    function buildComponents(nodes, adjacency) {
        let visited = new Set();
        let components = [];

        function dfs(start) {
            let stack = [start];
            let comp = [];
            while (stack.length) {
                let node = stack.pop();
                if (visited.has(node)) continue;
                visited.add(node);
                comp.push(node);
                let neighbors = adjacency.get(node) || [];
                neighbors.forEach(n => {
                    if (!visited.has(n)) stack.push(n);
                });
            }
            return comp;
        }

        nodes.forEach(n => {
            if (!visited.has(n)) {
                components.push(dfs(n));
            }
        });

        return components;
    }

    const components = buildComponents(allNodeIds, adjacency);

    let __uidSeq = 0;
    function genUid(seed = "n") { __uidSeq += 1; return seed + "__u" + __uidSeq; }

    function baseId(d) {
        if (d.baseId) return d.baseId;
        if (typeof d.id === "string" && d.id.indexOf("node_") === 0) return d.id.slice(5);
        return d.id;
    }

    // Lazy child creation from adjacency
    function materializeChildren(node) {
        const neighbors = adjacency.get(baseId(node)) || [];
        node.children = neighbors.map(nId => ({
            id: "node_" + nId,
            baseId: nId,
            uid: genUid(nId),
            hidden: false
        }));
    }

    // Collapse all children of a node
    function collapseAll(node) {
        if (node.children) {
            node._children = node.children;
            node._children.forEach(child => {
                child.hidden = true;
                collapseAll(child);
            });
            node.children = null;
        }
    }

    const treeContainer = d3.select("#tree-view")
        .style("width", "100%")
        .style("padding", "20px");

    const nodeWidth = 200;
    const nodeSpacing = 10;
    const expandedNodes = new Set();

    // Build adjacency map from edges
    const treeAdjacency = new Map();
    (data.edges || []).forEach(e => {
        if (!treeAdjacency.has(e.from)) treeAdjacency.set(e.from, []);
        treeAdjacency.get(e.from).push(e.to);
    });

    // Recursive function to render nodes
    function renderNodes(parentSelection, nodeList) {
        const nodes = parentSelection.selectAll(".tree-node")
            .data(nodeList, d => d.id);

        const nodeEnter = nodes.enter()
            .append("div")
            .attr("class", "tree-node")
            .style("display", "block")
            .style("margin-bottom", nodeSpacing + "px")
            .style("width", nodeWidth + "px")
            .style("cursor", "pointer")
            .style("border", "1px solid #999")
            .style("border-radius", "4px")
            .style("padding", "5px")
            .style("background", "#eef");

        // Header with id + [+]
        nodeEnter.append("div")
            .attr("class", "node-header")
            .style("font-weight", "bold")
            .style("color", "white")
            .style("background", "blue")
            .style("padding", "2px 5px")
            .style("text-align", "center")
            .text(function(d) {
                const linkedIds = treeAdjacency.get(d.id) || [];
                const plus = (d.attributes && d.attributes.length) || linkedIds.length ? " [+]" : "";
                return d.id + plus;
            })
            .on("click", function(d) {
                d3.event.stopPropagation();

                let bodyDiv = d3.select(this.parentNode).select(".node-body");

                if (expandedNodes.has(d.id)) {
                    bodyDiv.style("display", "none").selectAll("*").remove();
                    expandedNodes.delete(d.id);
                } else {
                    bodyDiv.style("display", "block");

                    // Show attributes
                    bodyDiv.selectAll(".attr")
                        .data(d.attributes || [])
                        .enter()
                        .append("div")
                        .attr("class", "attr")
                        .style("padding-left", "15px")
                        .style("font-size", "12px")
                        .text(attr => `${attr.key}: ${attr.value}`);

                    // Show linked nodes in a column
                    const linkedIds = treeAdjacency.get(d.id) || [];
                    if (linkedIds.length) {
                        const linkedNodes = linkedIds.map(id => {
                            const origNode = data.nodes.find(n => n.id === id);
                            return origNode || {id, attributes: []};
                        });

                        const linkedContainer = bodyDiv.append("div")
                            .style("padding-left", "15px")
                            .style("margin-top", "5px");

                        renderNodes(linkedContainer, linkedNodes);
                    }

                    expandedNodes.add(d.id);
                }
            });

        // Body div hidden initially
        nodeEnter.append("div")
            .attr("class", "node-body")
            .style("display", "none");

        nodes.exit().remove();
    }
    renderNodes(treeContainer, data.nodes);
    

    // Compute graph bounds for scaling in Bird View
    var minX = d3.min(data.nodes, d => d.x);
    var maxX = d3.max(data.nodes, d => d.x);
    var minY = d3.min(data.nodes, d => d.y);
    var maxY = d3.max(data.nodes, d => d.y);

    var graphWidth = maxX - minX;
    var graphHeight = maxY - minY;
    var scaleFactor = Math.min(birdWidth / graphWidth, birdHeight / graphHeight) * 0.5; // Smaller to fit better

    var offsetX = (birdWidth - graphWidth * scaleFactor) / 1.3;
    var offsetY = (birdHeight - graphHeight * scaleFactor) / 1.3;

    // Main View
    var svg = d3.select("#main-svg")
        .attr("width", width)
        .attr("height", height);

    var container = svg.append("g");

    // Arrow marker
    svg.append("defs").append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 20)  // how far from the node center the arrow tip should be
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5") // arrow shape
        .attr("fill", "#9ecae1");

    var zoom = d3.behavior.zoom()
        .scaleExtent([0.5, 2])
        .on("zoom", function () {
            container.attr("transform", `translate(${d3.event.translate}) scale(${d3.event.scale})`);
            updateBirdView();
        });

    svg.call(zoom);

    data.edges.forEach(function (edge) {
        edge.source = data.nodes.find(node => node.id === edge.from);
        edge.target = data.nodes.find(node => node.id === edge.to);
    });

    var force = d3.layout.force()
        .size([width, height])
        .nodes(data.nodes)
        .links(data.edges)
        .linkDistance(300)
        .charge(-500)
        .on("tick", tick)
        .start();

    var link = container.selectAll(".link")
        .data(data.edges)
        .enter().append("line")
        .attr("class", "link")
        .attr("stroke-width", 2)
        .attr("stroke", "#9ecae1")
        .attr("marker-end", "url(#arrow)");

    // ---- Node blocks as SVG groups with header + tspans for attributes ----
    var node = container.selectAll(".node")
        .data(data.nodes, function(d) { return d.id; });

    // ENTER
    var nodeEnter = node.enter().append("g")
        .attr("class", function(d){ return "node main-node-" + d.id; })
        .attr("transform", function(d){ return "translate(" + d.x + "," + d.y + ")"; })
        .call(d3.behavior.drag()
            .on("dragstart", function(d) {
                d3.event.sourceEvent.stopPropagation();
                d.fixed = true;
            })
            .on("drag", function(d) {
                d.px += d3.event.dx;
                d.py += d3.event.dy;
                d.x += d3.event.dx;
                d.y += d3.event.dy;
                force.resume();
                updateBirdView();
            })
            .on("dragend", function(d) {
                d.fixed = false;
            })
        )
        .on("mouseover", showDetails)
        .on("mouseout", hideDetails);

    // background rect (size depends on attributes count)
    nodeEnter.append("rect")
        .attr("class", "node-rect")
        .attr("x", -8)
        .attr("y", -12)
        .attr("rx", 6)
        .attr("ry", 6)
        .attr("width", 150)
        .attr("height", function(d) {
            var attrs = d.attributes ? d.attributes.length : 0;
            return 36 + attrs * 16; // header(approx) + each attribute line ~16px
        })
        .attr("fill", "#f5f5f5")
        .attr("stroke", "#999");

    // header (bold ID)
    nodeEnter.append("text")
        .attr("class", "node-header")
        .attr("x", 10)
        .attr("y", 10)
        .style("font-weight", "bold")
        .style("font-size", "13px")
        .text(function(d){ return 'ID ' + d.id; });

    // attributes block (we'll append tspans here)
    nodeEnter.append("text")
        .attr("class", "node-attributes")
        .attr("x", 4)
        .attr("y", 4 + 12 + 16) // start below header
        .style("font-size", "12px")
        .style("fill", "black")
        .each(function(d) {
            var textEl = d3.select(this);
            var attrs = d.attributes || [];
            // bind attribute array to tspans
            var tsp = textEl.selectAll("tspan")
                .data(attrs);

            // enter
            tsp.enter().append("tspan")
                .attr("x", 4)
                .attr("dy", function(_, i) { return (i === 0) ? "0px" : "15px"; })
                .text(function(a){ return a.key + ": " + a.value; });

            // update text (in case data changes)
            tsp.text(function(a){ return a.key + ": " + a.value; });

            // exit
            tsp.exit().remove();
        });

    // EXIT
    node.exit().remove();

    // keep your tick function to move groups (adjusted to select ".node")
    function tick() {
        link.attr("x1", function(d) { return d.source.x; })
            .attr("y1", function(d) { return d.source.y; })
            .attr("x2", function(d) { return d.target.x; })
            .attr("y2", function(d) { return d.target.y; });

    // move the group
    container.selectAll(".node")
        .attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });

    updateBirdView();
}

    let currentHighlightedNode = null;

    function highlightTreeNode(nodeId) {
        let correctedId = "node_" + nodeId;
        let nodeSelection = d3.select(".tree-node-" + correctedId);

        nodeSelection.select("circle")
            .transition().duration(200)
            .attr("fill", "red");
    }


    // Function to remove highlight from a tree node
    function unhighlightTreeNode(nodeId) {
        d3.selectAll(".tree-node-node_" + nodeId + " circle")
            .transition().duration(200)
            .attr("fill", "lightblue");
    }

    function showDetails(d) {
        // Highlight in both views
        d3.selectAll(".main-node-" + d.id + " circle").transition().duration(200).attr("fill", "red");
        d3.selectAll(".bird-node-" + d.id).transition().duration(200).attr("fill", "red");

        // Highlight in tree view
        highlightTreeNode(d.id);

        d3.select("body").append("div")
            .attr("id", "tooltip")
            .style("position", "absolute")
            .style("background", "lightgray")
            .style("padding", "5px")
            .style("border-radius", "5px")
            .style("left", `${d3.event.pageX + 10}px`)
            .style("top", `${d3.event.pageY - 20}px`)
            .text(`ID: ${d.id}`);
    }

    function hideDetails(d) {
        d3.selectAll(".main-node-" + d.id + " circle").transition().duration(200).attr("fill", "blue");
        d3.selectAll(".bird-node-" + d.id).transition().duration(200).attr("fill", "blue");

        // Remove highlight in tree view
        unhighlightTreeNode(d.id);

        d3.select("#tooltip").remove();
    }

    node.on("mouseover", showDetails);
    node.on("mouseout", hideDetails);

    // Bird View Setup
    var birdSvg = d3.select("#bird-view");
    var birdContainer = birdSvg.append("g");

    var birdLink = birdContainer.selectAll(".bird-link")
        .data(data.edges)
        .enter().append("line")
        .attr("class", "bird-link")
        .attr("stroke-width", 1)
        .attr("stroke", "#aaa");

    // group = rectangle + text
    var birdNode = birdContainer.selectAll(".bird-node")
        .data(data.nodes)
        .enter().append("g")
        .attr("class", d => "bird-node bird-node-" + d.id);

    // rectangle
    birdNode.append("rect")
        .attr("width", 12)
        .attr("height", 9)
        .attr("fill", "blue")
        .attr("rx", 2)  // rounded corners
        .attr("ry", 2);

    // text (small ID inside rectangle)
    birdNode.append("text")
        .attr("x", 6)                  // center horizontally (half of width)
        .attr("y", 6)                  // small vertical padding
        .attr("text-anchor", "middle") // center align
        .style("fill", "white")
        .style("font-size", "7px")     // tiny font
        .text(d => d.id);

    var birdViewport = birdSvg.append("rect")
        .attr("fill", "none")
        .attr("stroke", "red")
        .attr("stroke-width", 1);

    function updateBirdView() {
        // move whole group instead of rect/text separately
        birdNode.attr("transform", d => 
            "translate(" + 
            ((d.x - minX) * scaleFactor + offsetX - 6) + "," + // center by half width
            ((d.y - minY) * scaleFactor + offsetY - 4) + ")"
        );

        birdLink.attr("x1", d => (d.source.x - minX) * scaleFactor + offsetX)
            .attr("y1", d => (d.source.y - minY) * scaleFactor + offsetY)
            .attr("x2", d => (d.target.x - minX) * scaleFactor + offsetX)
            .attr("y2", d => (d.target.y - minY) * scaleFactor + offsetY);

        var mainTransform = d3.transform(container.attr("transform"));
        var tx = -mainTransform.translate[0] * scaleFactor + offsetX;
        var ty = -mainTransform.translate[1] * scaleFactor + offsetY;
        var s = mainTransform.scale[0];

        birdViewport.attr("x", tx)
            .attr("y", ty)
            .attr("width", (width / s) * scaleFactor)
            .attr("height", (height / s) * scaleFactor);
    }
</script>
